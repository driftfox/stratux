<div class="sx-map-page">
	<div class="panel panel-default sx-map-panel">
		<div class="panel-heading">
			<span class="panel_label">Traffic Map</span> 
			<span ng-show="ConnectState == 'Connected'" class="label label-success">{{ConnectState}}</span>
			<span ng-hide="ConnectState == 'Connected'" class="label label-danger">{{ConnectState}}</span>
		</div>

		<div class="panel-body-fullsize sx-map-body">
			<!-- The empty swipe handlers claim horizontal swipes, so panning the map
			     does not also open or close the menu (index.html binds swipes on .app). -->
			<div id="map_display" class="sx-map-fill" style="width: 100%; height: 100%" ui-swipe-left="" ui-swipe-right=""></div>
		</div>
	</div>
</div>
